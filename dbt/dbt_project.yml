name: sakuracon
version: "1.0.0"
config-version: 2

profile: sakuracon

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  sakuracon:
    staging:
      +materialized: view
      +schema: staging
    marts:
      # Tables, not views: the dashboard queries these repeatedly and Redshift
      # should not recompute the joins on every Tableau interaction.
      +materialized: table
      +schema: warehouse
